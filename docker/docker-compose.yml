version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gestor-espacial-3d
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/spatial_inventory.db
    volumes:
      - ../backend:/app/backend
      - ../frontend:/app/frontend
      - inventory-data:/data

volumes:
  inventory-data:
